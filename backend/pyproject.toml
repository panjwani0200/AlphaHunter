[project]
name = "nse-ai-trading-backend"
version = "0.1.0"
description = "Backend for AlphaHunter"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
    "uvicorn[standard]>=0.29",
    "yfinance>=0.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
