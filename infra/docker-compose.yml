services:
  postgres:
    image: postgres:16-alpine
    container_name: nse-ai-trading-postgres
    environment:
      POSTGRES_DB: nse_ai_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nse_ai_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

